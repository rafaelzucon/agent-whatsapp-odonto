AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Agente WhatsApp do consultório odontológico no AWS Lambda, na configuração de menor custo: webhook
  (Function URL) -> SQS FIFO -> conversa, DynamoDB sob demanda (sem VPC, NAT ou banco ligado 24h), segredos
  no Parameter Store, manutenção via EventBridge Scheduler e API administrativa opcional. Implante com
  aws/implantar.sh.

Parameters:
  WhatsAppPhoneNumberId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: Phone Number ID do número do consultório na Cloud API (painel da Meta).
  WhatsAppNumeroConsultorio:
    Type: String
    AllowedPattern: "[0-9]{10,15}"
    Description: Número que recebe os avisos de agendamento (DDI + DDD + número, só dígitos).
  WhatsAppVersaoApi:
    Type: String
    Default: v24.0
  WhatsAppUsarTemplate:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Avisar o consultório com template aprovado (funciona fora da janela de 24h).
  ConsultorioNome:
    Type: String
    Default: Consultório Odontológico
  ConsultorioEndereco:
    Type: String
    Default: Rua Exemplo, 123 - Centro
  AnthropicModelo:
    Type: String
    Default: claude-haiku-4-5
    Description: Modelo Claude usado para classificar queixas e interpretar datas.
  TranscricaoProvedor:
    Type: String
    Default: openai
    AllowedValues: [openai, none]
    Description: "openai = transcreve áudios com o Whisper; none = pede que o paciente escreva."
  ConcorrenciaConversa:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 50
    Description: >
      Máximo de instâncias simultâneas da função de conversa (2 é o mínimo do SQS e basta para um consultório;
      mensagens do mesmo paciente são sempre processadas em ordem, uma por vez).
  HabilitarApiAdmin:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Cria a função da API administrativa (/api/admin/**, protegida pelo ADMIN_TOKEN).
  HabilitarBackupContinuo:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Backup contínuo do DynamoDB (PITR: restauração a qualquer segundo dos últimos 35 dias). Cobrado por GB
      guardado: centavos por mês para um consultório.
  VersaoImplantacao:
    Type: String
    Default: inicial
    AllowedPattern: "[a-zA-Z0-9]{1,10}"
    Description: >
      Hash (10 caracteres) do pacote, do template, dos parâmetros e dos segredos, calculado pelo
      aws/implantar.sh. Mudar este valor publica novas versões das funções (e novos snapshots do SnapStart).
  DiasRetencaoLogs:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  ComApiAdmin: !Equals [!Ref HabilitarApiAdmin, "true"]
  ComBackupContinuo: !Equals [!Ref HabilitarBackupContinuo, "true"]

Globals:
  Function:
    Runtime: java21
    # Graviton (arm64): cerca de 20% mais barato por GB-segundo que x86_64.
    Architectures: [arm64]
    CodeUri: ../target/agent-whatsapp-odonto-lambda.zip
    MemorySize: 1024
    Timeout: 30
    AutoPublishAlias: atual
    # Sem custo extra no runtime Java: a inicialização do Spring é capturada uma vez por versão publicada.
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        ODONTO_PARAMETROS_CAMINHO: !Sub "/${AWS::StackName}/segredos"
        DYNAMODB_TABELA: !Ref Tabela
        FILA_MENSAGENS_URL: !Ref FilaMensagens
        WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
        WHATSAPP_NUMERO_CONSULTORIO: !Ref WhatsAppNumeroConsultorio
        WHATSAPP_VERSAO_API: !Ref WhatsAppVersaoApi
        WHATSAPP_USAR_TEMPLATE: !Ref WhatsAppUsarTemplate
        CONSULTORIO_NOME: !Ref ConsultorioNome
        CONSULTORIO_ENDERECO: !Ref ConsultorioEndereco
        ANTHROPIC_MODELO: !Ref AnthropicModelo
        TRANSCRICAO_PROVEDOR: !Ref TranscricaoProvedor

Resources:
  # ------------------------------------------------------------------ dados
  # Tabela única (single-table design) cobrada por requisição e por GB guardado: sem uso, custo zero.
  # pk/sk = chave do item; gsi1 = listagens por tipo em ordem (agenda, retenção); gsi2 = consultas do paciente.
  # Mantida se a pilha for removida (Retain + proteção contra exclusão).
  Tabela:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-dados"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: gsi1pk, AttributeType: S}
        - {AttributeName: gsi1sk, AttributeType: S}
        - {AttributeName: gsi2pk, AttributeType: S}
        - {AttributeName: gsi2sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - {AttributeName: gsi1pk, KeyType: HASH}
            - {AttributeName: gsi1sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
        - IndexName: gsi2
          KeySchema:
            - {AttributeName: gsi2pk, KeyType: HASH}
            - {AttributeName: gsi2sk, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      # Cifrada em repouso com a chave própria da AWS (sem custo de KMS); os dados pessoais ainda são cifrados
      # pela aplicação (AES-GCM) antes de gravar.
      SSESpecification:
        SSEEnabled: false
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [ComBackupContinuo, true, false]
      DeletionProtectionEnabled: true
      Tags:
        - {Key: aplicacao, Value: agent-whatsapp-odonto}

  # ------------------------------------------------------------------ fila
  # FIFO com grupo = número do paciente: mensagens do mesmo paciente são processadas em ordem, uma por vez.
  FilaMensagens:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-mensagens.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FilaMensagensFalhas.Arn
        maxReceiveCount: 5

  FilaMensagensFalhas:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-mensagens-falhas.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ------------------------------------------------------------------ logs
  LogsWebhook:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-webhook"
      RetentionInDays: !Ref DiasRetencaoLogs

  LogsConversa:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-conversa"
      RetentionInDays: !Ref DiasRetencaoLogs

  LogsManutencao:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-manutencao"
      RetentionInDays: !Ref DiasRetencaoLogs

  LogsAdmin:
    Type: AWS::Logs::LogGroup
    Condition: ComApiAdmin
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-admin"
      RetentionInDays: !Ref DiasRetencaoLogs

  # ------------------------------------------------------------------ permissões
  # Leitura dos segredos (SecureString com a chave gerenciada aws/ssm, que dispensa kms:Decrypt na política).
  PoliticaLerSegredos:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Leitura dos parametros de segredos do agente
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: [ssm:GetParametersByPath, ssm:GetParameters, ssm:GetParameter]
            Resource:
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/segredos"
              - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/segredos/*"

  # ------------------------------------------------------------------ funções
  # Fora de VPC: acessam DynamoDB, SQS, SSM e as APIs externas (Meta, Anthropic, OpenAI) direto pela internet,
  # sem NAT Gateway. Com o SnapStart a configuração e os segredos ficam congelados no snapshot de cada versão:
  # AutoPublishCodeSha256 recebe a VersaoImplantacao (hash de pacote + template + parâmetros + segredos, calculado
  # pelo aws/implantar.sh), então qualquer mudança publica novas versões e snapshots.

  # Recebe o webhook da Meta: valida a assinatura, enfileira e responde 200 em milissegundos (sem Spring).
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-webhook"
      Description: Webhook da WhatsApp Cloud API (valida assinatura e enfileira no SQS FIFO)
      Handler: br.com.consultorio.odonto.infraestrutura.lambda.WebhookHandler::handleRequest
      AutoPublishCodeSha256: !Ref VersaoImplantacao
      MemorySize: 512
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref LogsWebhook
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - !Ref PoliticaLerSegredos
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FilaMensagens.QueueName

  # Conduz a conversa: consome a fila FIFO, grava no DynamoDB, chama a IA e responde pelo WhatsApp.
  # A concorrência é limitada pelo ScalingConfig do SQS (sem concorrência reservada, que falha em
  # contas novas com cota de 10 execuções simultâneas).
  ConversaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-conversa"
      Description: Máquina de estados da conversa (consumidor da fila FIFO)
      Handler: br.com.consultorio.odonto.infraestrutura.lambda.ConversaHandler::handleRequest
      AutoPublishCodeSha256: !Ref VersaoImplantacao
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref LogsConversa
      Policies:
        - !Ref PoliticaLerSegredos
        - DynamoDBCrudPolicy:
            TableName: !Ref Tabela
      Events:
        Mensagens:
          Type: SQS
          Properties:
            Queue: !GetAtt FilaMensagens.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: !Ref ConcorrenciaConversa

  # Substitui os @Scheduled do modo servidor (EventBridge Scheduler: 14 milhões de execuções/mês grátis).
  ManutencaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-manutencao"
      Description: Expira conversas abandonadas e expurga o histórico (LGPD)
      Handler: br.com.consultorio.odonto.infraestrutura.lambda.ManutencaoHandler::handleRequest
      AutoPublishCodeSha256: !Ref VersaoImplantacao
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref LogsManutencao
      Policies:
        - !Ref PoliticaLerSegredos
        - DynamoDBCrudPolicy:
            TableName: !Ref Tabela
      Events:
        # A conversa expira após 2h sem resposta: verificar a cada 15 min basta e reduz as execuções.
        ExpirarConversas:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            Input: '{"tarefa":"expirar-conversas"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
        ExpurgarMensagens:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 3 * * ? *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{"tarefa":"expurgar-mensagens"}'

  # API administrativa (agenda, cancelamentos, bloqueios), protegida pelo ADMIN_TOKEN.
  AdminFunction:
    Type: AWS::Serverless::Function
    Condition: ComApiAdmin
    Properties:
      FunctionName: !Sub "${AWS::StackName}-admin"
      Description: API administrativa /api/admin/** (Spring MVC no aws-serverless-java-container)
      Handler: br.com.consultorio.odonto.infraestrutura.lambda.AdminHandler::handleRequest
      AutoPublishCodeSha256: !Ref VersaoImplantacao
      LoggingConfig:
        LogGroup: !Ref LogsAdmin
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - !Ref PoliticaLerSegredos
        - DynamoDBCrudPolicy:
            TableName: !Ref Tabela

Outputs:
  UrlWebhook:
    Description: URL de callback a cadastrar no painel da Meta (WhatsApp > Configuração > Webhook)
    Value: !GetAtt WebhookFunctionUrl.FunctionUrl
  UrlApiAdmin:
    Condition: ComApiAdmin
    Description: "Base da API administrativa (ex.: GET {url}api/admin/agenda?inicio=2026-12-01)"
    Value: !GetAtt AdminFunctionUrl.FunctionUrl
  TabelaDynamoDb:
    Description: Tabela com os dados do consultório (mantida se a pilha for removida)
    Value: !Ref Tabela
  CaminhoSegredos:
    Description: Caminho dos segredos no Parameter Store
    Value: !Sub "/${AWS::StackName}/segredos"
  FilaMensagens:
    Value: !Ref FilaMensagens
  FilaMensagensFalhas:
    Description: Mensagens que falharam 5 vezes (verifique os logs da função de conversa)
    Value: !Ref FilaMensagensFalhas
