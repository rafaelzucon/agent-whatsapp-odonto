name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build e testes (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes unitários, de aplicação e de arquitetura (ArchUnit)
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-surefire
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: agent-whatsapp-odonto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (sobe o contêiner e checa a saúde)
        run: |
          docker run -d --name odonto -p 8080:8080 \
            -e CRIPTO_CHAVE_DADOS="$(openssl rand -base64 32)" \
            -e CRIPTO_CHAVE_HASH="$(openssl rand -base64 32)" \
            -e DB_SENHA=ci \
            agent-whatsapp-odonto:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Aplicação saudável."; exit 0
            fi
            sleep 3
          done
          docker logs odonto
          exit 1
