name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Build e testes (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testes unitários, de aplicação e de arquitetura (ArchUnit)
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-surefire
          path: target/surefire-reports/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: agent-whatsapp-odonto:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça (sobe o contêiner e checa a saúde)
        run: |
          docker run -d --name odonto -p 8080:8080 \
            -e CRIPTO_CHAVE_DADOS="$(openssl rand -base64 32)" \
            -e CRIPTO_CHAVE_HASH="$(openssl rand -base64 32)" \
            -e DB_SENHA=ci \
            agent-whatsapp-odonto:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Aplicação saudável."; exit 0
            fi
            sleep 3
          done
          docker logs odonto
          exit 1

  lambda:
    name: Pacote e template do AWS Lambda
    runs-on: ubuntu-latest
    needs: testes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pacote zip do Lambda (perfil Maven lambda)
        run: ./mvnw -B -ntp -Plambda package -DskipTests

      - name: Limite de 250 MB descompactado
        run: |
          python3 - <<'PY'
          import zipfile
          total = sum(i.file_size for i in zipfile.ZipFile("target/agent-whatsapp-odonto-lambda.zip").infolist())
          print(f"Pacote descompactado: {total / 1048576:.1f} MB")
          assert total < 250 * 1024 * 1024, "Pacote excede o limite de 250 MB do Lambda"
          PY

      - name: Validação do template SAM e do script de implantação
        run: |
          pip install -q cfn-lint
          cfn-lint --regions sa-east-1 us-east-1 -- aws/template.yaml
          shellcheck aws/implantar.sh

      - name: Teste de fumaça do webhook no emulador do Lambda (RIE)
        run: |
          mkdir -p /tmp/funcao && unzip -q target/agent-whatsapp-odonto-lambda.zip -d /tmp/funcao
          docker run -d --name webhook -p 9000:8080 -v /tmp/funcao:/var/task:ro \
            -e WHATSAPP_TOKEN_VERIFICACAO=ci -e WHATSAPP_SEGREDO_APP=ci \
            -e FILA_MENSAGENS_URL=https://sqs.sa-east-1.amazonaws.com/000000000000/ci.fifo \
            -e AWS_REGION=sa-east-1 \
            public.ecr.aws/lambda/java:21 \
            br.com.consultorio.odonto.infraestrutura.lambda.WebhookHandler::handleRequest
          evento='{"version":"2.0","rawPath":"/","rawQueryString":"hub.mode=subscribe&hub.verify_token=ci&hub.challenge=4242","queryStringParameters":{"hub.mode":"subscribe","hub.verify_token":"ci","hub.challenge":"4242"},"requestContext":{"http":{"method":"GET","path":"/"}},"isBase64Encoded":false}'
          for i in $(seq 1 20); do
            resposta=$(curl -fsS -d "$evento" http://localhost:9000/2015-03-31/functions/function/invocations || true)
            if echo "$resposta" | grep -q '"statusCode":200' && echo "$resposta" | grep -q 4242; then
              echo "Webhook respondeu ao desafio: $resposta"; exit 0
            fi
            sleep 2
          done
          echo "Resposta: $resposta"; docker logs webhook
          exit 1
